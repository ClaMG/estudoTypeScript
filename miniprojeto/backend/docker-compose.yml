services:
  db:
    image: postgres:16
    container_name: pet_ts
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pet_ts:/var/lib/postgresql/data

volumes:
  pet_ts: